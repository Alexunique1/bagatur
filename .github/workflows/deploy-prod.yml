name: Deploy to production VDS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagatur-production
  cancel-in-progress: false

env:
  PROD_SITE_URL: https://bagaturbjj.com
  PROD_REMOTE_BASE: /var/www/bagatur

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bagaturbjj.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_SITE_URL: ${{ env.PROD_SITE_URL }}
          NUXT_PUBLIC_PREVIEW_MODE: 'false'
          NUXT_PUBLIC_CMS_URL: ''

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/public/index.html
          test -f .output/public/gallery/training/index.html
          test -f .output/public/gallery/tournaments/index.html
          test -f .output/public/gallery/kids/index.html
          test -f .output/public/gallery/adults/index.html
          test -f .output/public/achievements/index.html
          grep -q 'index, follow, max-image-preview:large' .output/public/index.html
          if grep -q 'noindex' .output/public/index.html; then
            echo 'Production homepage must be indexable.' >&2
            exit 1
          fi
          grep -q 'tel:+359877069665' .output/public/index.html

      - name: Package release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="/tmp/bagatur-${release_id}.tar.gz"
          cms_archive="/tmp/bagatur-cms-${release_id}.tar.gz"
          cms_checksum_file="/tmp/bagatur-cms-${release_id}.sha256"
          tar -czf "$archive" -C .output/public .
          tar -czf "$cms_archive" -C pocketbase pb_migrations
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          cms_checksum="$(sha256sum "$cms_archive" | awk '{print $1}')"
          printf '%s\n' "$cms_checksum" > "$cms_checksum_file"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "cms_archive=$cms_archive" >> "$GITHUB_OUTPUT"
          echo "cms_checksum_file=$cms_checksum_file" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/bagatur_deploy"
          chmod 600 "$HOME/.ssh/bagatur_deploy"
          cp .github/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i "$HOME/.ssh/bagatur_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -P '${{ vars.PROD_PORT }}' \
            '${{ steps.release.outputs.archive }}' \
            '${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}:${{ env.PROD_REMOTE_BASE }}/incoming/bagatur-${{ steps.release.outputs.release_id }}.tar.gz'
          scp \
            -i "$HOME/.ssh/bagatur_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -P '${{ vars.PROD_PORT }}' \
            '${{ steps.release.outputs.cms_archive }}' \
            '${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}:${{ env.PROD_REMOTE_BASE }}/incoming/cms-migrations.tar.gz'
          scp \
            -i "$HOME/.ssh/bagatur_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -P '${{ vars.PROD_PORT }}' \
            '${{ steps.release.outputs.cms_checksum_file }}' \
            '${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}:${{ env.PROD_REMOTE_BASE }}/incoming/cms-migrations.sha256'

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/bagatur_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -p '${{ vars.PROD_PORT }}' \
            '${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}' \
            bash -s -- \
            '${{ steps.release.outputs.release_id }}' \
            '${{ steps.release.outputs.checksum }}' \
            '${{ env.PROD_REMOTE_BASE }}' \
            '${{ env.PROD_SITE_URL }}' <<'REMOTE'
          set -euo pipefail

          release_id="$1"
          expected_checksum="$2"
          remote_base="$3"
          site_url="$4"

          case "$release_id" in
            *[!A-Za-z0-9._-]*) echo 'Invalid release id.' >&2; exit 1 ;;
          esac

          if [ "$remote_base" != '/var/www/bagatur' ]; then
            echo 'Unexpected deployment directory.' >&2
            exit 1
          fi

          archive="$remote_base/incoming/bagatur-$release_id.tar.gz"
          release="$remote_base/releases/$release_id"
          previous="$(readlink "$remote_base/current" 2>/dev/null || true)"
          actual_checksum="$(sha256sum "$archive" | awk '{print $1}')"

          if [ "$actual_checksum" != "$expected_checksum" ]; then
            echo 'Release checksum mismatch.' >&2
            exit 1
          fi

          if [ -e "$release" ]; then
            echo 'Release directory already exists.' >&2
            exit 1
          fi

          mkdir "$release"
          tar -xzf "$archive" -C "$release"
          test -f "$release/index.html"
          test -f "$release/gallery/tournaments/index.html"

          sudo /usr/local/sbin/deploy-bagatur-cms-migrations

          ln -sfn "releases/$release_id" "$remote_base/current"

          health_body="$(mktemp)"
          trap 'rm -f "$health_body"' EXIT

          if curl -fsS --retry 6 --retry-delay 2 -o "$health_body" "$site_url/" && grep -q 'Силен характер' "$health_body"; then
            rm -f "$archive"
            printf 'Activated release %s\n' "$release_id"
          else
            if [ -n "$previous" ]; then
              ln -sfn "$previous" "$remote_base/current"
            else
              rm -f "$remote_base/current"
            fi
            echo 'Health check failed; previous release restored.' >&2
            exit 1
          fi
          REMOTE

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          root_body="$(mktemp)"
          root_headers="$(mktemp)"
          tournaments_body="$(mktemp)"
          achievements_body="$(mktemp)"
          trap 'rm -f "$root_body" "$root_headers" "$tournaments_body" "$achievements_body"' EXIT
          curl -fsS --retry 6 --retry-delay 2 -D "$root_headers" -o "$root_body" "$PROD_SITE_URL/"
          grep -q 'Силен характер' "$root_body"
          grep -q 'index, follow, max-image-preview:large' "$root_body"
          if grep -qi '^x-robots-tag:.*noindex' "$root_headers"; then
            echo 'Production response must not send X-Robots-Tag: noindex.' >&2
            exit 1
          fi
          curl -fsS -o "$tournaments_body" "$PROD_SITE_URL/gallery/tournaments/"
          grep -q 'Турнири и състезания' "$tournaments_body"
          curl -fsS -o "$achievements_body" "$PROD_SITE_URL/achievements/"
          grep -q 'Всички състезания. Всички резултати.' "$achievements_body"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '### Bagatur production deployment'
            echo ''
            echo "- URL: $PROD_SITE_URL"
            echo "- Release: ${{ steps.release.outputs.release_id }}"
            echo '- Status: verified'
          } >> "$GITHUB_STEP_SUMMARY"
